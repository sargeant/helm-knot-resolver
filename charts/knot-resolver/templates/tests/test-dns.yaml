{{- $server := printf "%s.%s.svc.cluster.local" (include "knot-resolver.fullname" .) .Release.Namespace }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "knot-resolver.fullname" . }}-test-dns
  labels:
    {{- include "knot-resolver.testLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    # Both containers poll rather than query once. Readiness gates on TCP 5353,
    # and kresd accepts TCP a moment before it answers on UDP, so a single-shot
    # nslookup can arrive in that gap and get ICMP port unreachable.
    - name: dns-resolve
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 15); do
            nslookup example.com {{ $server }} && exit 0
            sleep 2
          done
          echo "no answer for example.com from {{ $server }} within 30s"
          exit 1
    # Waits for a name that should resolve before asserting that a bogus one
    # does not. Asserting the failure on its own passes for the wrong reason
    # when the resolver is simply not answering yet, since everything SERVFAILs.
    - name: dnssec-validate
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 15); do
            nslookup example.com {{ $server }} >/dev/null 2>&1 && break
            sleep 2
          done
          if ! nslookup example.com {{ $server }} >/dev/null 2>&1; then
            echo "resolver never came up; not asserting DNSSEC failure"
            exit 1
          fi
          ! nslookup dnssec-failed.org {{ $server }}
