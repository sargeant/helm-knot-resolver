name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Check chart version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          chart=$(helm show chart charts/knot-resolver | awk '/^version:/ {print $2}')
          echo "tag=$tag chart=$chart"
          if [ "$tag" != "$chart" ]; then
            echo "::error::Chart.yaml version ($chart) != tag $GITHUB_REF_NAME; chart-releaser publishes the Chart.yaml version"
            exit 1
          fi

      - name: Lint chart
        run: helm lint charts/knot-resolver

      - name: Validate rendered manifests
        run: |
          set -euo pipefail
          for f in charts/knot-resolver/ci/*.yaml; do
            echo "--- Validating with $f ---"
            helm template test-release charts/knot-resolver -f "$f" --set service.clusterIP=10.96.0.53 \
              --set forwarding.kubeDNS.clusterIP=10.96.0.10 \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          done

  release:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up yq
        uses: mikefarah/yq@master

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: charts/knot-resolver/RELEASE-NOTES.md

      - name: Generate ArtifactHub changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff-artifacthub.toml
          args: --latest --strip header
        env:
          OUTPUT: ARTIFACTHUB-CHANGES.yaml

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GPG_SIGNING_KEY }}" | base64 -d | gpg --import --batch
          gpg --export-secret-keys > ~/.gnupg/secring.gpg

      - name: Inject ArtifactHub changelog into Chart.yaml
        run: |
          CHANGES=$(cat ARTIFACTHUB-CHANGES.yaml)
          export CHANGES
          yq -i '.annotations."artifacthub.io/changes" = strenv(CHANGES)' charts/knot-resolver/Chart.yaml

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
          config: cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SIGN: "true"
          CR_KEY: "Knot Resolver Helm Chart <knot-resolver@sargeant.net.nz>"
          CR_KEYRING: ~/.gnupg/secring.gpg

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        run: |
          helm package --sign --key "Knot Resolver Helm Chart <knot-resolver@sargeant.net.nz>" --keyring ~/.gnupg/secring.gpg charts/knot-resolver
          helm push knot-resolver-*.tgz oci://ghcr.io/${{ github.repository_owner }}
