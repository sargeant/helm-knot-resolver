name: CI

# Runs on every pull request rather than filtering by path at the trigger.
# lint, kubeconform and trivy are required checks on main, and a workflow that
# never starts leaves them pending forever, so a PR touching only cliff.toml or
# a README could not merge. Job-level conditions skip the work instead, and a
# skipped job satisfies a required check.
on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for chart changes
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE" "$HEAD" \
            | grep -qE '^(charts/knot-resolver/|ct\.yaml$|\.github/workflows/lint-test\.yaml$)'; then
            echo "chart=true" >> "$GITHUB_OUTPUT"
            echo "Chart changed; running the full suite."
          else
            echo "chart=false" >> "$GITHUB_OUTPUT"
            echo "No chart changes; lint, kubeconform, trivy and install will skip."
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Lint chart
        run: ct lint --config ct.yaml

  kubeconform:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        run: |
          set -euo pipefail
          for f in charts/knot-resolver/ci/*.yaml; do
            echo "--- Validating with $f ---"
            helm template test-release charts/knot-resolver -f "$f" --set service.clusterIP=10.96.0.53 \
              --set forwarding.kubeDNS.clusterIP=10.96.0.10 \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          done

  trivy:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: charts/knot-resolver
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          trivy-config: charts/knot-resolver/trivy.yaml
          trivyignores: charts/knot-resolver/.trivyignore

  install:
    needs: [changes, lint, kubeconform, trivy]
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Create kind cluster
        uses: helm/kind-action@v1

      # ct.yaml pins the install namespace so the NetworkPolicy values file can
      # name it. ct expects a configured namespace to already exist.
      - name: Create test namespace
        run: kubectl create namespace knot-resolver-ci

      - name: Install chart
        run: ct install --config ct.yaml
